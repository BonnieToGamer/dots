# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

$terminal = kitty
$fileManager = nemo
$menu = wofi --show drun --allow-images --no-actions --width 512 -H 256 --insensitive
$screenshot = hyprshot -m region --clipboard-only
$picker = hyprpicker -a -f hex -r

source = ~/.config/hypr/modules/monitors.conf
source = ~/.config/hypr/modules/autostart.conf
source = ~/.config/hypr/modules/env.conf
source = ~/.config/hypr/modules/look.conf
source = ~/.config/hypr/modules/input.conf
source = ~/.config/hypr/modules/keybindings.conf
source = ~/.config/hypr/modules/groups.conf
source = ~/.config/hypr/modules/windowrules.conf
