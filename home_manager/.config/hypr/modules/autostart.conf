# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle &
# exec-once = hyprpaper &
exec-once= swww-daemon --format xrgb &
exec-once = mako &
exec-once = waybar &
exec-once = nm-applet &
exec-once = steam -silent &
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 3 silent] vesktop

# set theme
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Everforest-Dark"
exec-once = gsettings set org.gnome.desktop.interface icon-theme "Everforest-Dark"
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "catppuccin-macchiato-blue-cursors"

exec=swww restore