# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

exec-once = nest
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hypridle &
exec-once = swww-daemon --format xrgb &
exec-once = mako &
exec-once = waybar &
exec-once = nm-applet &
exec-once = steam -silent &
# exec-once = [workspace 2 silent] firefox
# exec-once = [workspace 2 silent] discord

# set theme
exec = gsettings set org.gnome.desktop.interface gtk-theme "Everforest-Dark"
exec = gsettings set org.gnome.desktop.interface icon-theme "Everforest-Dark"
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec = gsettings set org.gnome.desktop.interface cursor-theme "catppuccin-macchiato-blue-cursors"
exec = gsettings set org.gnome.desktop.interface font-name "Open Sans 10"
exec = gsettings set org.gnome.desktop.interface monospace-font-name "Adwaita Mono 11"
exec = gsettings set org.gnome.desktop.interface document-font-name "Adwaita Sans 11"

exec = swww restore