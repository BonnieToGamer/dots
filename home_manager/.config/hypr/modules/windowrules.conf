# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$
windowrule = float, class:^(nemo)$
windowrule = float, class:^(vlc)$
windowrule = tile, class:^(Aseprite)$


# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
windowrulev2 = float, class:.*\(DEBUG\)

# fix tooltips (always have a title of `win.<id>`)
windowrulev2 = noinitialfocus, class:^(.*jetbrains.*)$, title:^(win.*)$
windowrulev2 = nofocus, class:^(.*jetbrains.*)$, title:^(win.*)$
# fix tab dragging (always have a single space character as their title)
windowrulev2 = noinitialfocus, class:^(.*jetbrains.*)$, title:^\\s$
windowrulev2 = nofocus, class:^(.*jetbrains.*)$, title:^\\s$

windowrulev2 = noinitialfocus, class:^(.*ILSp.*)$, title:^(win.*)$
windowrulev2 = nofocus, class:^(.*ILSp.*)$, title:^(win.*)$
# fix tab dragging (always have a single space character as their title)
windowrulev2 = noinitialfocus, class:^(.*ILSp.*)$, title:^$
windowrulev2 = nofocus, class:^(.*ILSp.*)$, title:^$

windowrulev2 = float, class:^(Minecraft\* 1.21.4)$
